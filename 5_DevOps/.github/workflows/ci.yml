name: QuestFlow Continuous Integration & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Run Automated Tests & SDLC Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Frontend JavaScript Syntax
        run: |
          node -c questflow-frontend/server.js
          node -c questflow-frontend/script.js

      - name: Execute Automated Unit Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run Repository Compliance Audit
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'questflow-backend')
          from services.rule_engine import calculate_compliance
          files = [os.path.relpath(os.path.join(r, f), '.').replace('\\\\', '/') for r, d, fs in os.walk('.') if not any(p in ('node_modules', '.git', '__pycache__') for p in r.replace('\\\\', '/').split('/')) for f in fs]
          score, missing, satisfied = calculate_compliance('Waterfall', files)
          print(f'Continuous Compliance Score: {score}%')
          assert score >= 90, f'Compliance score {score}% is below required gate (90%)'
          "
